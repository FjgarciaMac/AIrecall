[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airecall-sdk"
version = "0.4.0"
description = "Drop-in long-term memory layer for AI agents - episodic + semantic memory with hybrid retrieval"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIrecall contributors" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
langchain = ["langchain-core>=0.2"]

[project.scripts]
airecall = "airecall.cli:main"
